<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 920" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .box { stroke:#2c3e50; stroke-width:1.5; rx:8; ry:8; }
      .title { font-weight:600; fill:#fff; }
      .sub { fill:#fff; font-size:11px; }
      .note { fill:#2c3e50; font-size:11px; font-style:italic; }
      .edge-label { fill:#555; font-size:11px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="920" fill="#fafbfc"/>

  <!-- 1. API simulator -->
  <rect class="box" x="380" y="20" width="200" height="50" fill="#8e44ad"/>
  <text class="title" x="480" y="50" text-anchor="middle">API simulator</text>

  <!-- Arrow down -->
  <line x1="480" y1="70" x2="480" y2="110" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. Airflow -->
  <rect class="box" x="380" y="115" width="200" height="50" fill="#e67e22"/>
  <text class="title" x="480" y="145" text-anchor="middle">Airflow</text>
  <text class="sub" x="480" y="158" text-anchor="middle">(оркестрация DAG)</text>

  <line x1="480" y1="165" x2="480" y2="205" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. MinIO / raw -->
  <rect class="box" x="380" y="210" width="200" height="50" fill="#16a085"/>
  <text class="title" x="480" y="240" text-anchor="middle">MinIO / raw</text>

  <line x1="480" y1="260" x2="480" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4. Spark -->
  <rect class="box" x="380" y="305" width="200" height="50" fill="#c0392b"/>
  <text class="title" x="480" y="335" text-anchor="middle">Spark</text>
  <text class="sub" x="480" y="348" text-anchor="middle">(transform_load_mart)</text>

  <line x1="480" y1="355" x2="480" y2="400" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 5. Postgres mart + Postgres restricted (PII) -->
  <rect class="box" x="180" y="405" width="260" height="60" fill="#2980b9"/>
  <text class="title" x="310" y="432" text-anchor="middle">Postgres mart</text>
  <text class="sub" x="310" y="450" text-anchor="middle">(публичные витрины)</text>

  <rect class="box" x="520" y="405" width="280" height="60" fill="#7f8c8d"/>
  <text class="title" x="660" y="432" text-anchor="middle">Postgres restricted (PII)</text>
  <text class="sub" x="660" y="450" text-anchor="middle">только data_steward</text>

  <!-- соединяющая линия от Spark к обеим БД -->
  <path d="M 480 395 L 310 405" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 480 395 L 660 405" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- стрелка вниз от mart к DQ -->
  <line x1="310" y1="465" x2="310" y2="520" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 6. Data Quality checks -->
  <rect class="box" x="160" y="525" width="300" height="70" fill="#d35400"/>
  <text class="title" x="310" y="552" text-anchor="middle">Data Quality checks</text>
  <text class="sub" x="310" y="570" text-anchor="middle">ExternalTaskSensor</text>
  <text class="sub" x="310" y="584" text-anchor="middle">→ ждёт transform_load_mart</text>

  <!-- Три ветки вниз -->
  <!-- левая: check_results -->
  <line x1="210" y1="595" x2="210" y2="660" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- центральная: incidents -->
  <line x1="310" y1="595" x2="310" y2="660" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- правая: логика FAIL -->
  <line x1="410" y1="595" x2="410" y2="660" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 7a. dq.check_results -->
  <rect class="box" x="100" y="665" width="220" height="70" fill="#27ae60"/>
  <text class="title" x="210" y="690" text-anchor="middle">dq.check_results</text>
  <text class="sub" x="210" y="710" text-anchor="middle">PASS / FAIL</text>
  <text class="sub" x="210" y="724" text-anchor="middle">по каждой проверке</text>

  <!-- 7b. dq_incident.incidents -->
  <rect class="box" x="340" y="665" width="240" height="70" fill="#16a085"/>
  <text class="title" x="460" y="690" text-anchor="middle">dq_incident.incidents</text>
  <text class="sub" x="460" y="710" text-anchor="middle">авто-OPEN на каждый FAIL</text>

  <!-- 7c. HIGH / MEDIUM / LOW -->
  <rect class="box" x="600" y="665" width="300" height="110" fill="#34495e"/>
  <text class="title" x="750" y="690" text-anchor="middle">Реакция на severity</text>
  <text class="sub" x="750" y="715" text-anchor="middle" fill="#e74c3c">● HIGH FAIL → DAG падает</text>
  <text class="sub" x="750" y="738" text-anchor="middle" fill="#f39c12">● MEDIUM → инцидент, DAG идёт</text>
  <text class="sub" x="750" y="761" text-anchor="middle" fill="#2ecc71">● LOW → инцидент, DAG идёт</text>

  <!-- Связь incidents → severity -->
  <line x1="580" y1="700" x2="600" y2="720" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Подпись про blocked -->
  <text class="note" x="620" y="810">MEDIUM/LOW — не блокируют пайплайн</text>

  <!-- Легенда -->
  <g transform="translate(40,840)">
    <text font-weight="600" fill="#2c3e50">Поток данных сверху вниз:</text>
    <text y="18" fill="#555">API → Airflow → MinIO → Spark → Postgres (mart + PII) → DQ → результаты/инциденты</text>
  </g>
</svg>